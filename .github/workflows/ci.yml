name: CI

on: [pull_request]

jobs:
  check_changes:
    name: Check file changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
              - 'mise.toml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
              - 'mise.toml'

  backend_lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    needs: check_changes
    if: ${{ needs.check_changes.outputs.backend == 'true' }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Lint Code Base
        uses: github/super-linter/slim@b807e99ddd37e444d189cfd2c2ca1274d8ae8ef1 # v7
        env:
          # api-spec/ is a multi-file OpenAPI bundle (root.json + fragments) that
          # relies on openapi-generator's lenient $ref resolution; the fragments
          # are not standalone-valid OpenAPI documents, so spectral cannot lint them.
          FILTER_REGEX_EXCLUDE: gradlew|frontend/|api-spec/
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_EDITORCONFIG: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GROOVY: true
          VALIDATE_JSON: true
          VALIDATE_KOTLIN: true
          VALIDATE_MARKDOWN: true
          VALIDATE_OPENAPI: true
          VALIDATE_SHELL_SHFMT: true
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend_test:
    name: Backend Test
    runs-on: ubuntu-latest
    needs: check_changes
    if: ${{ needs.check_changes.outputs.backend == 'true' }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: "java"
      - name: Resolve Java Docker tag from mise.toml
        working-directory: backend
        run: echo "JAVA_DOCKER_TAG=$(sh scripts/mise-java-docker-tag.sh)" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Prepare env
        working-directory: backend
        run: |
          mv .ci.env .env
          mv .ci.db-env .db-env
      - name: Start database services first
        working-directory: backend
        run: |
          echo "Starting database service..."
          docker compose up -d db
          echo "Waiting for database to be ready..."
          sleep 10
          docker compose ps
      - name: Run Server
        working-directory: backend
        run: |
          echo "Building and starting web application..."
          ./gradlew clean installDist
          docker compose build web
          docker compose up -d web
          echo "All services started"
      - name: Show Docker container status and logs
        working-directory: backend
        run: |
          echo "Waiting 10 seconds for application to start..."
          sleep 10
          echo "=== Docker daemon status ==="
          docker version
          echo "=== All containers ==="
          docker ps -a
          echo "=== Compose project containers ==="
          docker compose ps -a
          echo "=== Container logs ==="
          echo "--- DB logs ---"
          docker compose logs db --tail 50 || echo "No db logs available"
          echo "--- Web logs ---"
          docker compose logs web --tail 100 || echo "No web logs available"
      - name: Verify application is accessible
        working-directory: backend
        run: |
          echo "Testing application endpoint..."
          curl -f http://0.0.0.0:8080/api/v1/health || {
            echo "Application health check failed!"
            exit 1
          }
      - name: Run Test
        working-directory: backend
        run: ./gradlew test --info --debug --stacktrace
      # 失敗したテストの詳細ログを出力
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/

  frontend_test:
    name: Frontend Test
    runs-on: ubuntu-latest
    needs: check_changes
    if: ${{ needs.check_changes.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'frontend/package.json'
          cache: 'pnpm'
      - name: git setting
        run: |
          git config --local user.email "10195648+hmiyado@users.noreply.github.com"
          git config --local user.name "hmiyado"
      - name: Install dependencies
        run: pnpm install
      - name: Update patch package
        working-directory: frontend
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: sh scripts/update-patch-package.sh
      - name: Verify OpenAPI client
        working-directory: frontend
        run: sh scripts/verify-openapi-client.sh
      - name: Run lint
        working-directory: frontend
        run: pnpm lint
      - name: Run tests
        working-directory: frontend
        run: pnpm test