name: Claude Issue Development

# Issue に "claude" ラベルを付ける、または本文/タイトルに @claude と書くことで、
# claude-code-action の tag モードが自動でブランチ作成・実装・PR作成まで行う。
on:
  issues:
    types: [opened, labeled]

jobs:
  claude:
    if: github.actor == 'hmiyado'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # claude-code-action は作業ブランチの作成やコミットをワークスペース上の
      # git リポジトリに対して行うため、checkout が必須。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126 # v1.0.191
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "claude"
          ssh_signing_key: ${{ secrets.SSH_SIGNING_KEY }}
          bot_name: "hmiyado"
          bot_id: "10195648"
          claude_args: |
            --model claude-sonnet-5
