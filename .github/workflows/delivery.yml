name: Delivery

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - 'main'

jobs:
  check_changes:
    name: Check file changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              # ワークフロー定義自体の変更もデプロイ対象にする。
              # これがないと、デプロイ手順 (action のバージョン、認証、push先など) を
              # 変更しても Deploy Backend が skip され、変更が検証されないまま残る。
              # ci.yml のフィルタと揃えてある。
              - '.github/workflows/**'
              - 'mise.toml'

  deploy_backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: check_changes
    # pull_request の closed はマージせずに閉じた場合も発火するため、
    # merged を明示的に確認する。これがないとPRを閉じただけでデプロイが走る。
    # workflow_dispatch は手動実行なので merged の判定対象外。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      needs.check_changes.outputs.backend == 'true')
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: git setting
        run: |
          git config --local user.email "10195648+hmiyado@users.noreply.github.com"
          git config --local user.name "hmiyado"

      - name: Set up Java
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: "java"

      - name: Build distribution app
        working-directory: backend
        run: ./gradlew clean installDist

      - name: Set New Version
        run: echo new_version="$(cat backend/build/generated/version.txt)" >> "$GITHUB_ENV"

      - name: Resolve Java Docker tag from mise.toml
        working-directory: backend
        run: echo "java_docker_tag=$(sh scripts/mise-java-docker-tag.sh)" >> "$GITHUB_OUTPUT"
        id: java-tag

      # 長期AWSクレデンシャルを持たずOIDCでロールを引き受ける。
      # ロールARNはリポジトリVariable (機密ではないためSecretにしていない)。
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        id: ecr-login

      # フェーズ9でEC2（amd64）を撤去し、ビルド対象はarm64のみになった。
      # amd64ランナー上でarm64イメージをクロスビルドするにはQEMUが引き続き必要
      # （buildxは非ネイティブアーキテクチャのビルドをbinfmt_misc経由のQEMUエミュレーション
      # に頼るため、単一プラットフォームであってもクロスビルドである限り不要にはならない）。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # ECR: arm64 -> Lambda (Graviton) が使う。
      #
      # Lambdaはマニフェストリスト (イメージインデックス) を解決できず、単一アーキテクチャの
      # イメージマニフェストを直接指す必要がある。インデックスを指すタグを image_uri に
      # 渡すと CreateFunction が InvalidParameterValueException
      # ("The image manifest, config or layer media type ... is not supported") で失敗する。
      #
      # provenance: false が必須。buildxはattestationを付けるとその紐付け先として
      # インデックスを作るため、platformsを1つに絞ってもインデックスになってしまう。
      - name: Build and push Docker image (arm64, ECR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          push: true
          platforms: linux/arm64
          provenance: false
          build-args: |
            JAVA_DOCKER_TAG=${{ steps.java-tag.outputs.java_docker_tag }}
          tags: ${{ steps.ecr-login.outputs.registry }}/kottage:latest, ${{ steps.ecr-login.outputs.registry }}/kottage:${{ env.new_version }}

      # フェーズ8: Lambda移行 (docs/projects/lambda/migration-plan.md の8.1/8.2)。
      # kottage_app (backend/infra/lambda_app.tf) は image_uri の変更を
      # lifecycle.ignore_changes で無視しているため、以後のイメージ更新はここで行う。
      #
      # 上のECR pushは単一アーキ (arm64) かつ provenance 無効なので、タグは
      # イメージインデックスではなく単一マニフェストを直接指す。Lambdaはインデックスを
      # 解決できないが、この形ならタグをそのまま渡せる。

      # kottage_appの$LATESTを新イメージへ更新する。この時点ではまだ"live"
      # エイリアスは古いバージョンを指したままなので、本番トラフィックには影響しない。
      - name: Update kottage_app Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name kottage_app \
            --image-uri "${{ steps.ecr-login.outputs.registry }}/kottage:${{ env.new_version }}"

      - name: Wait for the function update to complete
        run: aws lambda wait function-updated --function-name kottage_app

      # $LATESTの内容をイミュータブルなバージョンとして発行する。
      - name: Publish a new kottage_app version
        id: lambda-version
        run: |
          version=$(aws lambda publish-version \
            --function-name kottage_app \
            --description "delivery.yml ${{ env.new_version }}" \
            --query 'Version' --output text)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # API Gatewayが実際に呼び出すのは"live"エイリアスのみ。ここで初めて
      # 本番トラフィックが新バージョンへ切り替わる。ロールバックは、このエイリアスを
      # 前のバージョンに戻す `aws lambda update-alias` で即時に行える。
      - name: Point the live alias at the new version
        run: |
          aws lambda update-alias \
            --function-name kottage_app \
            --name live \
            --function-version "${{ steps.lambda-version.outputs.version }}"
