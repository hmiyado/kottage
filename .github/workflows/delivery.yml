name: Delivery

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - 'main'

jobs:
  check_changes:
    name: Check file changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              # ワークフロー定義自体の変更もデプロイ対象にする。
              # これがないと、デプロイ手順 (action のバージョン、認証、push先など) を
              # 変更しても Deploy Backend が skip され、変更が検証されないまま残る。
              # ci.yml のフィルタと揃えてある。
              - '.github/workflows/**'
              - 'mise.toml'

  deploy_backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: check_changes
    if: github.event_name == 'workflow_dispatch' || needs.check_changes.outputs.backend == 'true'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: git setting
        run: |
          git config --local user.email "10195648+hmiyado@users.noreply.github.com"
          git config --local user.name "hmiyado"

      - name: Set up Java
        uses: jdx/mise-action@v4
        with:
          install_args: "java"

      - name: Build distribution app
        working-directory: backend
        run: ./gradlew clean installDist

      - name: Set New Version
        run: echo new_version="$(cat backend/build/generated/version.txt)" >> "$GITHUB_ENV"

      - name: Resolve Java Docker tag from mise.toml
        working-directory: backend
        run: echo "java_docker_tag=$(sh scripts/mise-java-docker-tag.sh)" >> "$GITHUB_OUTPUT"
        id: java-tag

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.5.1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 長期AWSクレデンシャルを持たずOIDCでロールを引き受ける。
      # ロールARNはリポジトリVariable (機密ではないためSecretにしていない)。
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      # arm64 (Lambda/Graviton向け) をamd64ランナー上でクロスビルドするためQEMUが必要。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # amd64は本番EC2 (t2.nano)、arm64はLambda (Graviton) 向け。
      # 両方をpushしておくことで、EC2は現行通りamd64をpullし続けつつ、
      # Lambda移行時にarm64をpullできる。
      # Docker HubとECRの両方にpushする (移行期間中はEC2がDocker Hubから取得するため)。
      - name: Build and push Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            JAVA_DOCKER_TAG=${{ steps.java-tag.outputs.java_docker_tag }}
          tags: miyado/kottage:latest, miyado/kottage:${{ env.new_version }}, ${{ steps.ecr-login.outputs.registry }}/kottage:latest, ${{ steps.ecr-login.outputs.registry }}/kottage:${{ env.new_version }}