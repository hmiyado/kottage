ktor {
  development = true
  development = ${?DEVELOPMENT}
  deployment {
    port = 8080
    port = ${?PORT}
    watch = [classes]
  }
  application {
    modules = [
      com.github.hmiyado.kottage.application.ApplicationKt.main
    ]
    version = ""
    version = ${?VERSION}
  }
  database {
    mysql {
      name = ""
      name = ${?MYSQL_DATABASE}
      host = ""
      host = ${?MYSQL_HOST}
      port = 3306
      port = ${?MYSQL_PORT}
      user = ""
      user = ${?MYSQL_USER}
      password = ""
      password = ${?MYSQL_PASSWORD}
      sslMode = "DISABLED"
      sslMode = ${?MYSQL_SSL_MODE}
    }
  }
  migration {
    # Default true: local dev convenience and unchanged EC2 behavior.
    # Set to false where migrations run as a separate step (e.g. Lambda).
    runOnStartup = true
    runOnStartup = ${?RUN_MIGRATION_ON_STARTUP}
  }
  authentication {
    sessionSignKey = ""
    sessionSignKey = ${?SESSION_SIGN_KEY}
    admin {
      name = "admin"
      name = ${?ADMIN_NAME}
      password = "admin"
      password = ${?ADMIN_PASSWORD}
    }
    oauth {
      google {
        clientId = ""
        clientId = ${?OIDC_GOOGLE_CLIENT_ID}
        clientSecret = ""
        clientSecret = ${?OIDC_GOOGLE_CLIENT_SECRET}
        callbackUrl = "http://localhost:8080/oauth/google/callback"
        callbackUrl = ${?OIDC_GOOGLE_CALLBACK_URL}
        defaultRedirectUrl = "http://localhost:3000"
        defaultRedirectUrl = ${?OIDC_GOOGLE_DEFAULT_REDIRECT_URL}
      }
    }

  }
  hooks = [
    {
      name = "on new entry created"
      method = "post"
      path = "/api/v1/entries"
      requestTo = "http://localhost:8080/on-new-entry-created"
      requestTo = ${?VERCEL_DEPLOY_HOOK}
    }
    {
      name = "on new comment created"
      method = "post"
      path = "/api/v1/entries/{serialNumber}/comments"
      requestTo = "http://localhost:8080/on-new-comment-created"
      requestTo = ${?VERCEL_DEPLOY_HOOK}
    }
  ]
}
